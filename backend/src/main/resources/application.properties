spring.application.name=eventsphere
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Database: MySQL (default). Every value can be overridden with an env var.
# To run without MySQL use the "h2" profile: SPRING_PROFILES_ACTIVE=h2
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# HS256 signing secret - must be at least 32 characters. ALWAYS override in production.
app.jwt.secret=${JWT_SECRET:eventsphere-local-dev-secret-change-me-please-2026}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}
# Comma separated list of front-end origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------------------------------------------------------------------
# AI (Google Gemini). Without a key the app uses built-in rule-based fallbacks.
# ---------------------------------------------------------------------------
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# ---------------------------------------------------------------------------
# Password reset with a 6-digit e-mailed code. With SMTP configured a real e-mail is sent. Without it,
# demo mode shows the code on screen (turn demo mode off on a public deployment).
# ---------------------------------------------------------------------------
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:10}
app.password-reset.demo-mode=${PASSWORD_RESET_DEMO_MODE:true}
app.mail.from=${MAIL_FROM:EventSphere <no-reply@eventsphere.app>}
# Brevo HTTPS e-mail API (free 300/day). Takes priority over SMTP; needed on hosts that block SMTP ports
# (e.g. Render's free plan). MAIL_FROM must be a sender address verified in Brevo.
app.mail.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Don't let an unreachable mail server mark the whole app unhealthy
management.health.mail.enabled=false

# Production accounts: comma-separated e-mails that are made admins (at startup and at sign-up),
# and a switch that deactivates the public demo accounts (their passwords are in the README).
app.admin-emails=${ADMIN_EMAILS:}
app.demo.disable-accounts=${DISABLE_DEMO_ACCOUNTS:false}

# Demo data is loaded on first start only (when the users table is empty)
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ---------------------------------------------------------------------------
# API docs + health
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=always
