# Run without MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Embedded H2 database in MySQL compatibility mode, stored in ./data (survives restarts).
spring.datasource.url=jdbc:h2:file:./data/eventsphere;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
