# In-memory H2 in MySQL mode; the same Flyway migrations run, and Hibernate validates the mapping against them.
spring.datasource.url=jdbc:h2:mem:eventsphere-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
app.seed-demo-data=false
app.ai.gemini.api-key=
