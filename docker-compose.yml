# One command runs the whole stack:  docker compose up --build
#   App:      http://localhost:3000
#   API docs: http://localhost:8080/swagger-ui.html  (or your BACKEND_PORT)
# Values come from .env (copy .env.example to .env first).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eventsphere
      MYSQL_USER: ${DB_USERNAME:-eventsphere}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eventsphere}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "3307:3306"   # 3307 on the host so it does not clash with a locally installed MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eventsphere?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-eventsphere}
      DB_PASSWORD: ${DB_PASSWORD:-eventsphere}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-at-least-32-chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      PASSWORD_RESET_DEMO_MODE: ${PASSWORD_RESET_DEMO_MODE:-true}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"   # set BACKEND_PORT if 8080 is taken on your machine

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
